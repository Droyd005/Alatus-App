name: ALATUS Windows - teste e release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Conferir versao da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ('${{ github.ref_name }}' -ne "v$v") { throw '[REL-01] A tag nao corresponde a versao do aplicativo.' }
      - name: Instalar backend
        shell: pwsh
        run: npm install --prefix app --omit=dev --no-audit --no-fund
      - name: Validar dependencias
        shell: pwsh
        run: |
          if (-not (Test-Path 'app/node_modules/baileys/package.json')) { throw '[CI-D00] Baileys ausente.' }
          if (-not (Test-Path 'app/node_modules/tesseract.js/package.json')) { throw '[CI-D00] Tesseract ausente.' }
      - name: Instalar dependencias desktop
        shell: pwsh
        run: npm install --prefix desktop --no-audit --no-fund
      - name: Testar backend
        shell: pwsh
        run: |
          npm --prefix app run check
          npm --prefix app test
      - name: Testar desktop e updater
        shell: pwsh
        run: |
          npm --prefix desktop run check
          npm --prefix desktop test
      - name: Criar instalador NSIS
        shell: pwsh
        run: npm --prefix desktop run dist:win
      - name: Validar instalador e metadados de atualizacao
        shell: pwsh
        run: |
          $inst = @(Get-ChildItem -Path dist/instalador -Filter 'ALATUS-Instalador-*.exe' -File)
          if ($inst.Count -ne 1) { throw '[REL-02] Instalador ausente ou duplicado.' }
          $meta = 'dist/instalador/latest.yml'
          if (-not (Test-Path $meta)) { throw '[REL-03] latest.yml ausente. Updater nao funcionara.' }
          $v = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $body = Get-Content $meta -Raw
          if ($body -notmatch [regex]::Escape("version: $v")) { throw '[REL-04] Versao do latest.yml divergente.' }
          if ($body -notlike "*$($inst[0].Name)*") { throw '[REL-05] Instalador nao consta no manifesto.' }
          $backend = 'dist/instalador/win-unpacked/resources/backend'
          foreach ($file in @('server.mjs','node_modules/baileys/package.json','node_modules/tesseract.js/package.json')) {
            if (-not (Test-Path "$backend/$file")) { throw "[CI-D03] Arquivo ausente no pacote: $file" }
          }
          if (-not (Test-Path 'dist/instalador/win-unpacked/resources/app-update.yml')) { throw '[REL-06] Configuracao de atualizacoes ausente.' }
          Write-Host "Instalador validado: $($inst[0].Name)"
      - uses: actions/upload-artifact@v4
        with:
          name: ALATUS-Desktop-v0.7.8-TESTE
          path: |
            dist/instalador/ALATUS-Instalador-*.exe
            dist/instalador/latest.yml
          if-no-files-found: error
          retention-days: 30
      - name: Publicar Release estavel no GitHub (somente tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $inst = @(Get-ChildItem dist/instalador -Filter 'ALATUS-Instalador-*.exe' -File)
          gh release create $tag $inst[0].FullName 'dist/instalador/latest.yml' --title "ALATUS $tag" --generate-notes --latest
